# One-command local stack:  docker compose up --build
#   dashboard  http://localhost:5173      API  http://localhost:3000
# Stop any locally running server/client first (they use the same ports), or override
# the host ports, e.g.  API_PORT=3100 WEB_PORT=5273 docker compose up --build
#
# Demo data (optional):
#   docker compose run --rm api node scripts/seed.js --confirm=distraction_tracker --rows 100000
#   then log in as demo1@example.test / demo-password
#
# The web service is the production build of the dashboard served by nginx (client/Dockerfile), not the Vite dev server:
# there is no hot reload here. For development run `npm run dev` in client/ as usual. The API address and the extension's id
# are baked into the page when it is built, so after changing API_PORT or VITE_EXTENSION_ID run `docker compose up --build`.
# To connect the extension, put its id (chrome://extensions) in a .env file next to this one: VITE_EXTENSION_ID=...
# The extension itself trusts only the ports built into it (5173 and 3000). With other ports, build it for them first:
#   node extension/configure.mjs --api http://localhost:<API_PORT>/api --dashboard http://localhost:<WEB_PORT>
# and load extension/dist (see the README, "Different ports").

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: distraction_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d distraction_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: distraction_tracker
      # Local-development default only. Set a long random JWT_SECRET in .env for anything shared.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      # The api runs in production mode (Secure login cookie), but this setup is plain http on localhost.
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:${API_PORT:-3000}/api
        VITE_EXTENSION_ID: ${VITE_EXTENSION_ID:-}
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
