# Serves the built dashboard (a single-page app) from the nginx image in client/Dockerfile.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Inherited by every location below, because none of them uses add_header itself (nginx drops inherited headers otherwise).
  # The page also carries its own Content-Security-Policy (added at build time); frame-ancestors can only be set by a header.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  # Built files have a content hash in their name, so a changed file always has a new name and can be cached for a year.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Anything else is a screen of the app (/login, /register, ...): hand back index.html and let the router show it.
  # index.html itself must never be cached, or a new release would not be picked up.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
