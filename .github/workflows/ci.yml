name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run coverage # runs the tests and prints line/branch coverage
      - uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/coverage-summary.json

  client:
    name: Client lint, typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage # runs the tests and prints line/branch coverage
      - uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/coverage-summary.json
      - run: npm run build
        timeout-minutes: 3 # about 10 seconds normally; slower means a tooling regression (docs/evidence/build-time-investigation.md)

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "test/*.test.mjs"

  web-container:
    name: Web container (nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Builds the dashboard into the nginx image and starts the whole stack; --wait returns once every health check passes.
      - run: docker compose up -d --build --wait --wait-timeout 240
      # 26 checks: routing, caching, gzip, security headers, non-root, health (docs/evidence/web-container.md)
      - run: bash docs/evidence/check-web-container.sh
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down -v

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
